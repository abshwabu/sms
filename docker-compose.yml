services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bina_schools_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${FORWARD_APP_PORT:-8000}:8000"
      - "${FORWARD_VITE_PORT:-5173}:5173"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bina_schools}
      DB_USERNAME: ${DB_USERNAME:-bina_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bina_network

  postgres:
    image: postgres:16-alpine
    container_name: bina_schools_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bina_schools}
      POSTGRES_USER: ${DB_USERNAME:-bina_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bina_user} -d ${DB_DATABASE:-bina_schools}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bina_network

  redis:
    image: redis:7-alpine
    container_name: bina_schools_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bina_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bina_network:
    driver: bridge
